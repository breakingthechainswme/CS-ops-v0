<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Prompt Builder — v0.2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap');
:root {
  /* Base palette */
  --bg:#f2f0eb;
  --white:#fff;
  --dark:#1a1917;
  --ink:#2a2826;
  --muted:#6f6d69;
  --border:#dddbd6;
  --border2:#c5c2bc;

  /* Accent — warm gold */
  --gold:#b5830a;
  --gold-light:#fdf4e3;
  --gold-border:#e8c96a;
  --gold-mid:#d4a017;

  /* Semantic callout colours */
  --amber-bg:#fdf4e3; --amber-border:#f0d898; --amber:#7a4f0a;
  --green-bg:#edf7f1; --green-border:#a8d9bc; --green:#1a6b3a;
  --blue-bg:#e8f0fb;  --blue-border:#a8c0e8;  --blue:#1a3a6b;
  --rose-bg:#fdf0f0;  --rose-border:#e8a8a8;  --rose:#6b1a1a;

  /* Step accent colours — one per card category */
  --c-type:#1a3a6b;    /* type select — indigo */
  --c-found:#2d6a4f;   /* foundation — forest */
  --c-strat:#b5830a;   /* strategy — gold */
  --c-aud:#6b3fa0;     /* audience — plum */
  --c-fmt:#1a6b5a;     /* format — teal */
  --c-con:#8b3a1a;     /* constraints — rust */
  --c-iter:#1a3a6b;    /* iteration — indigo */
  --c-out:#2d6a4f;     /* output — forest */
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background: var(--bg);
  background-image: radial-gradient(ellipse at 20% 0%, rgba(181,131,10,.07) 0%, transparent 60%),
                    radial-gradient(ellipse at 80% 100%, rgba(26,58,107,.06) 0%, transparent 60%);
  color:var(--ink);
  font-family:'IBM Plex Sans',sans-serif;
  font-size:15px;
  line-height:1.7;
  min-height:100vh;
}

.wrap{max-width:900px;margin:0 auto;padding:0 20px 80px}

/* ── Header ─────────────────────────────────────── */
.header{
  background: linear-gradient(135deg, #1a1917 0%, #2c2620 60%, #1a2a1a 100%);
  border-radius:0 0 20px 20px;
  margin:0 -20px 32px;
  padding:36px 36px 30px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
  position:relative;
  overflow:hidden;
}
.header::before{
  content:'';
  position:absolute;
  inset:0;
  background: radial-gradient(ellipse at 10% 50%, rgba(181,131,10,.18) 0%, transparent 55%),
              radial-gradient(ellipse at 90% 20%, rgba(45,106,79,.15) 0%, transparent 50%);
  pointer-events:none;
}
.h-eye{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:10px}
.header h1{font-size:34px;line-height:1.08;color:#fff;margin-bottom:10px}
.header p{font-size:14px;color:rgba(255,255,255,.6);max-width:580px}
.badge{
  font-family:'IBM Plex Mono',monospace;font-size:11px;
  border:1px solid rgba(255,255,255,.2);
  padding:6px 12px;border-radius:999px;
  background:rgba(255,255,255,.08);
  color:rgba(255,255,255,.7);
  white-space:nowrap;
  position:relative;
  z-index:1;
  flex-shrink:0;
}

/* ── Progress ────────────────────────────────────── */
.progress{display:grid;gap:7px;margin:0 0 24px}
.progress-bar{display:grid;grid-template-columns:repeat(var(--steps,6),1fr);gap:5px}
.seg{height:5px;background:var(--border);border-radius:999px;transition:background .3s}
.seg.active{background:linear-gradient(90deg,var(--gold-mid),var(--gold))}
.meta{font-size:13px;color:var(--muted)}

/* ── Cards ───────────────────────────────────────── */
.card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:16px;
  padding:24px 24px;
  margin-bottom:14px;
  box-shadow:0 1px 3px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:3px;
  background:var(--card-accent, transparent);
  border-radius:16px 16px 0 0;
}
.card h2{font-size:16px;color:var(--dark);margin-bottom:6px;font-weight:600}
.card p{font-size:14px;color:var(--muted)}

/* Card accent colours injected via JS data-step attr */
.card[data-step="type"]::before       {background:linear-gradient(90deg,var(--c-type),#2d5abf)}
.card[data-step="foundation"]::before {background:linear-gradient(90deg,var(--c-found),#52b788)}
.card[data-step="strategy"]::before   {background:linear-gradient(90deg,var(--c-strat),#f0c040)}
.card[data-step="mechanics"]::before  {background:linear-gradient(90deg,var(--c-strat),#f0c040)}
.card[data-step="audience"]::before   {background:linear-gradient(90deg,var(--c-aud),#9b6dcc)}
.card[data-step="format"]::before     {background:linear-gradient(90deg,var(--c-fmt),#40c9a2)}
.card[data-step="structure"]::before  {background:linear-gradient(90deg,var(--c-fmt),#40c9a2)}
.card[data-step="voice"]::before      {background:linear-gradient(90deg,var(--c-aud),#9b6dcc)}
.card[data-step="role"]::before       {background:linear-gradient(90deg,var(--c-type),#2d5abf)}
.card[data-step="context"]::before    {background:linear-gradient(90deg,var(--c-found),#52b788)}
.card[data-step="constraints"]::before{background:linear-gradient(90deg,var(--c-con),#d4602a)}
.card[data-step="iteration"]::before  {background:linear-gradient(90deg,var(--gold-mid),var(--gold))}
.card[data-step="output"]::before     {background:linear-gradient(90deg,var(--c-out),#52b788)}
.card[data-step="tools"]::before      {background:linear-gradient(90deg,var(--muted),var(--border2))}

/* ── Section titles ──────────────────────────────── */
.section-title{
  font-family:'IBM Plex Mono',monospace;
  font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);
  margin-bottom:16px;
  display:flex;align-items:center;gap:10px;
}
.section-title::after{content:'';height:1px;background:linear-gradient(90deg,var(--border2),transparent);flex:1}

/* ── Grid ────────────────────────────────────────── */
.grid{display:grid;gap:12px}
.grid.two{grid-template-columns:1fr 1fr}
.grid.three{grid-template-columns:repeat(3,1fr)}
.grid.four{grid-template-columns:repeat(4,1fr)}

/* ── Type cards ──────────────────────────────────── */
.type-card,.tag,.option-card{
  border:1px solid var(--border2);
  border-radius:12px;
  background:var(--white);
  cursor:pointer;
  transition:all .18s ease;
}
.type-card{padding:16px;min-height:116px;position:relative;overflow:hidden}
.type-card::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:var(--tc-color,var(--border));
  transition:opacity .18s;opacity:0;
}
.type-card:hover::after{opacity:1}
.type-card:hover{border-color:var(--tc-color,var(--dark));box-shadow:0 2px 8px rgba(0,0,0,.08);transform:translateY(-1px)}
.type-card.active{background:var(--dark);color:#fff;border-color:var(--dark);box-shadow:0 4px 14px rgba(0,0,0,.18);transform:translateY(-1px)}
.type-card.active::after{opacity:0}
.type-card .icon{font-size:22px;margin-bottom:8px}
.type-card .name{font-weight:600;margin-bottom:5px;font-size:14px}
.type-card .desc{font-size:12px;line-height:1.5;color:var(--muted)}
.type-card.active .desc{color:rgba(255,255,255,.7)}

/* Per-type accent colours */
.type-card[data-type="idea"]      {--tc-color:#b5830a}
.type-card[data-type="hook"]      {--tc-color:#1a3a6b}
.type-card[data-type="script"]    {--tc-color:#2d6a4f}
.type-card[data-type="generator"] {--tc-color:#6b3fa0}
.type-card[data-type="analysis"]  {--tc-color:#8b3a1a}
.type-card[data-type="workflow"]  {--tc-color:#1a6b5a}
.type-card[data-type="framework"] {--tc-color:#1a3a6b}
.type-card[data-type="tooling"]   {--tc-color:#2d6a4f}

/* ── Fields ──────────────────────────────────────── */
.field{margin-bottom:20px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--dark);margin-bottom:8px}
.field .hint{font-size:12px;color:var(--muted);margin-top:6px}
.input,.select,.textarea{
  width:100%;border:1px solid var(--border2);
  background:var(--white);border-radius:10px;
  padding:11px 13px;font:inherit;color:var(--ink);
  transition:border-color .15s, box-shadow .15s;
}
.input:focus,.select:focus,.textarea:focus{
  outline:none;
  border-color:var(--gold-mid);
  box-shadow:0 0 0 3px rgba(212,160,23,.12);
}
.textarea{min-height:110px;resize:vertical}

/* ── Tags ────────────────────────────────────────── */
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{
  padding:8px 13px;font-size:13px;
  background:var(--bg);border:1px solid var(--border2);
  border-radius:10px;color:var(--ink);
  transition:all .15s;
}
.tag:hover{border-color:var(--gold-mid);background:#fff;color:var(--dark)}
.tag.active{
  background:var(--dark);color:#fff;border-color:var(--dark);
  box-shadow:0 2px 6px rgba(0,0,0,.15);
}

/* ── Nav / Buttons ───────────────────────────────── */
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.btn{
  appearance:none;
  border:1px solid var(--border2);
  background:var(--white);
  color:var(--ink);
  border-radius:10px;
  padding:10px 16px;
  font:inherit;font-size:13px;
  cursor:pointer;
  transition:all .15s;
}
.btn:hover{border-color:var(--dark);background:var(--bg);color:var(--dark)}
.btn.primary{
  background:linear-gradient(135deg,#1a1917 0%,#2c2620 100%);
  color:#fff;
  border-color:transparent;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.btn.primary:hover{
  background:linear-gradient(135deg,#2c2620 0%,#1a1917 100%);
  box-shadow:0 3px 12px rgba(0,0,0,.28);
  transform:translateY(-1px);
}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

/* ── Callouts ────────────────────────────────────── */
.callout{
  border-radius:0 10px 10px 0;
  padding:13px 16px;margin:12px 0;
  font-size:13px;line-height:1.65;
  display:flex;gap:10px;align-items:flex-start;
}
.callout.blue  {background:var(--blue-bg);border-left:3px solid var(--blue);color:var(--blue)}
.callout.amber {background:var(--amber-bg);border-left:3px solid var(--gold-mid);color:var(--amber)}
.callout.green {background:var(--green-bg);border-left:3px solid var(--green);color:var(--green)}

/* ── Code block ──────────────────────────────────── */
.code{
  background:linear-gradient(160deg,#1a1917 0%,#232018 100%);
  border-radius:14px;overflow:hidden;
  border:1px solid rgba(255,255,255,.06);
  box-shadow:0 4px 20px rgba(0,0,0,.18);
}
.code-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 18px;
  border-bottom:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.03);
}
.code-head span{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.38)}
.code-head button{
  background:rgba(212,160,23,.15);
  color:rgba(255,220,100,.9);
  border:1px solid rgba(212,160,23,.3);
  border-radius:8px;padding:5px 12px;cursor:pointer;font-size:12px;
  transition:all .15s;
}
.code-head button:hover{background:rgba(212,160,23,.28);color:#fff}
.code-body{
  padding:20px;
  font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.85;
  white-space:pre-wrap;color:rgba(255,255,255,.85);
  max-height:420px;overflow:auto;
}

/* ── Summary ─────────────────────────────────────── */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kv{
  background:linear-gradient(135deg,var(--bg) 0%,#ede9e0 100%);
  border:1px solid var(--border);
  border-radius:10px;padding:13px;
}
.kv .k{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.kv .v{font-size:13px;color:var(--dark);line-height:1.5;font-weight:500}
.summary-layer{
  background:var(--white);
  border:1px solid var(--border);
  border-left:3px solid var(--gold-border);
  border-radius:0 12px 12px 0;
  padding:16px;margin-top:10px;
}
.summary-layer-label{font-weight:600;color:var(--dark);margin-bottom:8px;font-size:14px}
.summary-layer-row{display:grid;grid-template-columns:180px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.summary-layer-row:last-child{border-bottom:none}
.slr-k{font-size:13px;color:var(--muted)}
.slr-v{font-size:13px;color:var(--ink);font-weight:500}

/* ── Misc ────────────────────────────────────────── */
.small{font-size:12px;color:var(--muted)}
.hidden{display:none!important}

/* ── Project tracker ─────────────────────────────── */
.tracker-wrap{
  margin-top:48px;
  padding:28px 28px 32px;
  background:var(--white);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04);
  position:relative;overflow:hidden;
}
.tracker-wrap::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--c-found),var(--gold-mid),var(--c-type));
  border-radius:20px 20px 0 0;
}
.tracker-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
.tracker-header h3{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);
}
.tracker-actions{display:flex;gap:8px;flex-wrap:wrap}
.project-card{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px 18px;margin-bottom:10px;
  transition:box-shadow .15s;
}
.project-card:last-child{margin-bottom:0}
.project-card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.project-name{font-size:14px;font-weight:600;color:var(--dark)}
.project-meta{font-size:12px;color:var(--muted);margin-top:2px}
.project-btn-row{display:flex;gap:6px;flex-shrink:0}
.pipeline{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.pipe-stage{display:flex;align-items:center;gap:8px}

/* Stage nodes */
.stage-node{
  border:1px solid var(--border2);
  border-radius:10px;padding:8px 14px;
  font-size:12px;color:var(--muted);
  background:var(--white);
  min-width:90px;text-align:center;line-height:1.35;
  transition:all .18s;
}
.stage-node .stage-label{
  font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;
  display:block;margin-bottom:3px;
}
.stage-node .stage-val{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.stage-node.done{
  background:linear-gradient(135deg,#2d6a4f,#1a4a35);
  border-color:#1a4a35;color:#fff;
  box-shadow:0 2px 8px rgba(45,106,79,.3);
}
.stage-node.done .stage-label{color:rgba(255,255,255,.6)}
.stage-node.done .stage-val{color:rgba(255,255,255,.75)}
.stage-node.done:hover{box-shadow:0 3px 12px rgba(45,106,79,.4);transform:translateY(-1px)}
.stage-node[style*="pointer"]:not(.done):hover{border-color:var(--gold-mid);background:var(--gold-light)}

.pipe-arrow{color:var(--gold-border);font-size:16px;flex-shrink:0;font-weight:300}

.stage-expand{display:none;margin-top:12px;border-top:1px solid var(--border);padding-top:12px}
.stage-expand.open{display:block}
.stage-prompt-preview{
  font-family:'IBM Plex Mono',monospace;font-size:11px;
  color:var(--muted);line-height:1.65;white-space:pre-wrap;
  max-height:150px;overflow:auto;
  background:var(--dark);color:rgba(255,255,255,.75);
  border-radius:8px;padding:12px 14px;
}

/* ── Context carry-over ──────────────────────────── */
.ctx-toggle{
  font-size:13px;color:var(--gold);
  cursor:pointer;background:none;border:none;padding:0;
  font-family:inherit;
  text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:var(--gold-border);
  transition:color .15s;
}
.ctx-toggle:hover{color:var(--gold-mid)}
.ctx-box{
  background:linear-gradient(135deg,#fdf8ec,#fdf4e3);
  border:1px solid var(--gold-border);
  border-radius:12px;padding:16px 18px;margin:12px 0 6px;
}
.ctx-box label{font-size:13px;font-weight:600;color:var(--amber);display:block;margin-bottom:8px}
.ctx-box textarea{
  width:100%;min-height:90px;resize:vertical;
  border:1px solid var(--gold-border);border-radius:8px;
  padding:10px 12px;font:12px/1.6 'IBM Plex Mono',monospace;
  color:var(--ink);background:rgba(255,255,255,.8);
  transition:border-color .15s, box-shadow .15s;
}
.ctx-box textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(181,131,10,.12)}
.ctx-box .hint{font-size:12px;color:var(--amber);margin-top:8px;opacity:.8}

/* ── Responsive ──────────────────────────────────── */
@media(max-width:760px){
  .grid.two,.grid.three,.grid.four,.summary-grid{grid-template-columns:1fr}
  .header{border-radius:0 0 14px 14px;padding:28px 20px 24px;margin:0 -20px 24px}
  .header h1{font-size:26px}
  .summary-layer-row{grid-template-columns:1fr}
  .pipeline{flex-direction:column;align-items:flex-start}
  .pipe-arrow{transform:rotate(90deg)}
  .tracker-wrap{padding:20px 16px 24px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <div class="h-eye">Content Studio — Prompt Builder</div>
      <h1>Master Prompt Builder</h1>
      <p>An actual working builder file for testing flows, state, prompt assembly, summary output, copy behavior, and versioned iteration notes.</p>
    </div>
    <div class="badge">v0.3 — styled</div>
  </div>

  <!-- Floating guide button — always visible -->
  <a href="guide.html" target="_blank" rel="noopener" id="guideBtn"
     style="position:fixed;bottom:28px;right:24px;z-index:999;
            display:flex;align-items:center;gap:8px;
            background:linear-gradient(135deg,#1a1917,#2c2620);
            color:#fff;text-decoration:none;
            font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;
            padding:10px 18px;border-radius:999px;
            box-shadow:0 4px 16px rgba(0,0,0,.28);
            border:1px solid rgba(255,255,255,.12);
            transition:all .18s ease">
    <span style="font-size:15px">📖</span> User Guide
  </a>
  <style>
    #guideBtn:hover{box-shadow:0 6px 22px rgba(0,0,0,.38);transform:translateY(-2px)}
  </style>

  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
    <div class="meta" id="progressMeta">Step 1 of 6</div>
  </div>

  <div id="app"></div>

  <div class="tracker-wrap">
    <div class="tracker-header">
      <div class="section-title" style="margin-bottom:0;flex:1">Project pipeline tracker</div>
      <div class="tracker-actions">
        <button class="btn" style="font-size:12px;padding:6px 12px" onclick="promptNewProject()">+ New project</button>
        <button class="btn" style="font-size:12px;padding:6px 12px" onclick="showProjectPicker()">Manage</button>
      </div>
    </div>
    <div id="trackerMount"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'mpb_actual_builder_v0_1';
const TRACKER_KEY = 'mpb_projects_v0_2';
const PIPELINE_STAGES = ['idea','hook','script'];
const TYPE_META = {
  idea:{label:'Idea', icon:'✦', desc:'Generate content ideas, spot trends, find angles'},
  hook:{label:'Hook', icon:'↗', desc:'Write scroll-stopping opening lines'},
  script:{label:'Script', icon:'▣', desc:'Full carousel or video scripts'},
  generator:{label:'Generator', icon:'∞', desc:'Captions, hooks, or multi-format output'},
  analysis:{label:'Analysis', icon:'◌', desc:'Audience research and performance analysis'},
  workflow:{label:'Workflow', icon:'⇄', desc:'Multi-step process or automation prompts'},
  framework:{label:'Framework', icon:'□', desc:'Reusable prompt structures and templates'},
  tooling:{label:'Tooling', icon:'⚙', desc:'Business, lead gen, and operational prompts'}
};
const OPTIONS = {
  platforms:['Instagram','TikTok','YouTube','LinkedIn','Twitter/X','Facebook','Email newsletter','Website / Blog','Any platform'],
  domains:['Content','Business','Systems','Creative','Research','General'],
  versions:['V1','V2','V3','V4+'],
  priorities:['Speed','Simplicity','Cost Efficiency','Quality','Scalability','Accuracy','Originality'],
  linked:['Idea Vault','Hook Bank','Script Studio','Content Pipeline','Performance Database','Reference Data','Content Themes','Prompt Library'],
  awareness:['Unaware','Problem aware','Solution aware','Product aware','Most aware'],
  reasoning:['Fastest path','Step-by-step reasoning','Deep analysis','First principles','Compare options'],

/* ── Context carry-over parser ───────────────────── */
function parseContextBlock(raw){
  if(!raw || !raw.trim()) return {};
  const text = raw.trim();
  const out = {};
  // topic: look for TOPIC: or NICHE: lines
  const topicMatch = text.match(/(?:TOPIC|NICHE\s*\/\s*TOPIC|NICHE):\s*(.+)/i);
  if(topicMatch) out.topic = topicMatch[1].trim();
  // platform
  const platformMatch = text.match(/PLATFORM:\s*(.+)/i);
  if(platformMatch){
    const raw = platformMatch[1].trim();
    out.platforms = raw.split(/,\s*/).map(s=>s.trim()).filter(Boolean);
  }
  // audience
  const audMatch = text.match(/AUDIENCE:\s*(.+)/i);
  if(audMatch) out.audience = audMatch[1].trim();
  // tone
  const toneMatch = text.match(/TONE:\s*(.+)/i);
  if(toneMatch) out.tones = toneMatch[1].split(/,\s*/).map(s=>s.trim()).filter(Boolean);
  // goal
  const goalMatch = text.match(/(?:CONTENT\s*GOAL|GOAL):\s*(.+)/i);
  if(goalMatch) out.goal = goalMatch[1].trim();
  // raw block for appending to prompt
  out.raw = text;
  return out;
}
function applyContextToState(ctx, promptType){
  if(!ctx || !ctx.raw) return;
  if(promptType === 'idea'){
    if(ctx.topic) setVal('idea_topic', ctx.topic);
    if(ctx.audience) setVal('idea_audience', ctx.audience);
    if(ctx.platforms){
      const known = OPTIONS.platforms;
      const matched = ctx.platforms.filter(p => known.some(k => k.toLowerCase().includes(p.toLowerCase()) || p.toLowerCase().includes(k.toLowerCase())));
      if(matched.length) setVal('idea_platforms', matched);
    }
  }
  if(promptType === 'hook'){
    if(ctx.topic) setVal('hook_topic', ctx.topic);
    if(ctx.audience) setVal('hook_audience', ctx.audience);
    if(ctx.tones){
      const known = OPTIONS.tone;
      const matched = ctx.tones.filter(t => known.some(k => k.toLowerCase() === t.toLowerCase()));
      if(matched.length) setVal('hook_tone', matched);
    }
  }
  if(promptType === 'script'){
    if(ctx.topic) setVal('script_topic', ctx.topic);
    if(ctx.audience) setVal('script_audience', ctx.audience);
    if(ctx.tones){
      const known = OPTIONS.tone;
      const matched = ctx.tones.filter(t => known.some(k => k.toLowerCase() === t.toLowerCase()));
      if(matched.length) setVal('script_tone', matched);
    }
  }
  // store raw for prompt injection
  setVal('ctx_carry', ctx.raw);
}

function toggleArray(k,v,single=false,max=null){
  let arr = arrVal(k).slice();
  if(single){ arr = arr[0]===v ? [] : [v]; }
  else {
    arr = arr.includes(v) ? arr.filter(x=>x!==v) : [...arr,v];
    if(max && arr.length>max) arr = arr.slice(arr.length-max);

  setVal(k, arr);
  render();
}

    if(getVal('hook_prior_idea')) prompt += `\nSOURCE IDEA (hooks must be grounded in this):\n${getVal('hook_prior_idea')}\n`;
  }

  if(t==='script'){
    prompt += `TASK: Write a complete script.\n\n`;
    prompt += `TOPIC: ${getVal('script_topic')}\n`;
    if(arrVal('script_format').length) prompt += `FORMAT: ${arrVal('script_format').join(', ')}\n`;
    if(getVal('script_sections')) prompt += `SECTIONS: ${getVal('script_sections')}\n`;
    if(arrVal('script_goal').length) prompt += `GOAL: ${arrVal('script_goal').join(', ')}\n`;
    if(arrVal('script_framework').length) prompt += `FRAMEWORK: ${arrVal('script_framework').join(', ')}\n`;
    if(getVal('script_custom_framework')) prompt += `CUSTOM FRAMEWORK NOTES: ${getVal('script_custom_framework')}\n`;
    if(getVal('script_words_per_section')) prompt += `WORDS PER SECTION: Max ${getVal('script_words_per_section')} words\n`;
    if(arrVal('script_tone').length) prompt += `TONE: ${arrVal('script_tone').join(', ')}\n`;
    if(getVal('script_voice_desc')) prompt += `VOICE & STYLE: ${getVal('script_voice_desc')}\n`;
    if(getVal('script_audience')) prompt += `AUDIENCE: ${getVal('script_audience')}\n`;
    if(getVal('script_prior_hook')) prompt += `\nOPENING HOOK (use this exact line to open the script — do not rewrite it):\n${getVal('script_prior_hook')}\n`;
    if(getVal('script_prior_idea')) prompt += `\nSOURCE IDEA (script must stay true to this angle and goal):\n${getVal('script_prior_idea')}\n`;
    const source = arrVal('script_source')[0] || '';
    if(source==='Authentic') prompt += `\nCONTENT SOURCE — AUTHENTIC:\n- Write conversationally with natural spoken rhythm\n- Include [pause] or [emphasis] cues where a beat matters\n- Avoid anything over-scripted\n- Every line should sound like something a real creator would say aloud\n`;
    if(source==='AI-Generated') prompt += `\nCONTENT SOURCE — AI GENERATED:\n- Sentences must be clean and complete\n- Use punctuation deliberately to control pacing\n- Avoid contractions that AI voices mispronounce\n- Keep energy consistent throughout\n`;
    if(source==='Hybrid') prompt += `\nCONTENT SOURCE — HYBRID:\n- Write a strong structural draft the creator can edit into their voice\n- Mark lines with [ADD PERSONAL EXAMPLE HERE] where a story would strengthen it\n- Keep logic tight; humanize delivery later\n`;
  }

  if(['generator','analysis','workflow','framework','tooling'].includes(t)){
    prompt += `TASK: ${getVal('gen_outcome')}\n\n`;
    if(getVal('gen_domain')) prompt += `DOMAIN: ${getVal('gen_domain')}\n`;
    if(arrVal('gen_primary_role').length) prompt += `PRIMARY ROLE: ${arrVal('gen_primary_role').join(', ')}\n`;
    if(arrVal('gen_secondary_lens').length) prompt += `SECONDARY LENS: ${arrVal('gen_secondary_lens').join(', ')}\n`;
    if(getVal('gen_expertise')) prompt += `EXPERTISE LEVEL: ${getVal('gen_expertise')}\n`;
    if(getVal('gen_audience')) prompt += `AUDIENCE: ${getVal('gen_audience')}\n`;
    if(arrVal('gen_platforms').length) prompt += `PLATFORM: ${arrVal('gen_platforms').join(', ')}\n`;
    if(getVal('gen_existing')) prompt += `CONTEXT: ${getVal('gen_existing')}\n`;
  }

  if(arrVal('common_output_format').length) prompt += `\nRESPONSE FORMAT: ${arrVal('common_output_format').join(', ')}\n`;
  if(arrVal('common_tone').length) prompt += `TONE: ${arrVal('common_tone').join(', ')}\n`;
  if(getVal('common_words_avoid')) prompt += `WORDS TO AVOID: ${getVal('common_words_avoid')}\n`;
  if(arrVal('common_reasoning').length) prompt += `REASONING APPROACH: ${arrVal('common_reasoning').join(', ')}\n`;
  if(arrVal('common_self_check').length) prompt += `SELF-CHECK: ${arrVal('common_self_check').join(', ')}\n`;
  if(getVal('common_examples')) prompt += `\nFEW-SHOT EXAMPLES:\n${getVal('common_examples')}\n`;

  prompt += `\nFAIL-SAFES:\n- If required information is missing, state what is missing\n- Do not invent facts or sources\n- If assumptions are necessary, label them clearly\n- Follow the requested output format exactly\n`;
  return prompt.trim();
}

function suggestTitle(){
  const t = TYPE_META[state.promptType]?.label || 'Prompt';
  const platform = arrVal('idea_platforms')[0] || arrVal('hook_platform')[0] || arrVal('gen_platforms')[0] || arrVal('script_format')[0] || 'Any';
  const topic = (getVal('idea_topic') || getVal('hook_topic') || getVal('script_topic') || getVal('gen_outcome') || 'General prompt')
    .replace(/\s+/g,' ').trim().split(' ').slice(0,4).join(' ');
  const version = getVal('iter_version','V1');
  return `${t} — ${platform} — ${topic || 'General prompt'} — ${version}`;
}

function layerRows(obj){
  return Object.entries(obj).filter(([,v])=>v && (!(Array.isArray(v)) || v.length)).map(([k,v])=>`
    <div class="summary-layer-row"><span class="slr-k">${escapeHtml(k)}</span><span class="slr-v">${escapeHtml(Array.isArray(v)?v.join(', '):String(v))}</span></div>`).join('');
}

async function copyText(txt){
  if(!txt) return;
  function fallback(){
    const ta=document.createElement('textarea');
    ta.value=txt;
    ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0;';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{ document.execCommand('copy'); alert('Copied.'); }
    catch(e){ alert('Copy failed. Please copy manually.'); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && window.isSecureContext){
    try{ await navigator.clipboard.writeText(txt); alert('Copied.'); }
    catch(e){ fallback(); }
  } else fallback();
}

function copyFullSummary(){
  const title = getVal('suggestedTitle');
  const prompt = getVal('builtPrompt');
  const fields = Array.from(document.querySelectorAll('.kv')).map(el => `${el.querySelector('.k').innerText}: ${el.querySelector('.v').innerText}`).join('\n');
  const layers = Array.from(document.querySelectorAll('.summary-layer')).map(layer => {
    const label = layer.querySelector('.summary-layer-label').innerText;
    const rows = Array.from(layer.querySelectorAll('.summary-layer-row')).map(row => `${row.querySelector('.slr-k').innerText}: ${row.querySelector('.slr-v').innerText}`).join('\n');
    return `[${label}]\n──────────────────────────────\n${rows}`;
  }).join('\n\n');
  const out = `══════════════════════════════════════════════════\nPROMPT LIBRARY ENTRY\n══════════════════════════════════════════════════\nNAME: ${title}\n\nNOTION FIELDS\n──────────────────────────────\n${fields}\n\nBUILD NOTES (paste into page body or Iteration Notes)\n──────────────────────────────\n${layers}\n\n══════════════════════════════════════════════════\nFULL PROMPT (paste into page body)\n══════════════════════════════════════════════════\n${prompt}`;
  copyText(out);
}

function sendPrompt(){

  const path = getPath();
  document.documentElement.style.setProperty('--steps', path.length);
  document.getElementById('progressBar').innerHTML = path.map((_,i)=>`<div class="seg ${i<=state.step?'active':''}"></div>`).join('');
  document.getElementById('progressMeta').textContent = `Step ${state.step+1} of ${path.length} — ${path[state.step].title}`;
  document.getElementById('app').innerHTML = renderStep() + `
    <div class="card" data-step="tools">
      <div class="section-title">Session tools</div>
      <div class="nav">
        <button class="btn" onclick="saveSnapshotOnly()">Save snapshot</button>
        <button class="btn" onclick="showSnapshots()">View snapshots</button>
        <button class="btn" onclick="confirmRestart()">Reset builder</button>

}

    return; 
  }
  const prompt = buildPrompt();
  if(!prompt.trim()){ 
    const btn = document.querySelector('[onclick="saveSnapshotOnly()"]');
    if(btn){ const o=btn.textContent; btn.textContent='Add some content first'; setTimeout(()=>btn.textContent=o,2000); }
    return; 
  }
  state.snapshots = state.snapshots || [];
  state.snapshots.unshift({title:suggestTitle(), prompt, at:new Date().toISOString(), notes:getVal('iter_notes','')});
  state.snapshots = state.snapshots.slice(0,10);

  const btn = document.querySelector('[onclick="saveSnapshotOnly()"]');
  if(btn){ const o=btn.textContent; btn.textContent='Saved ✓'; setTimeout(()=>btn.textContent=o,1800); }
}

function showSnapshots(){

      <div class="nav"><button class="btn" onclick="render()">Back</button></div>

function escapeHtml(str){ return String(str ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }
function escapeAttr(str){ return escapeHtml(str).replace(/`/g,'&#96;'); }

function applyCtxAndContinue(){
  if(!validateStep()){ alert('Select a prompt type first.'); return; }
  const ctxInput = document.getElementById('ctxInput');
  if(ctxInput && ctxInput.value.trim()){
    setVal('ctx_raw', ctxInput.value);
    const ctx = parseContextBlock(ctxInput.value);
    applyContextToState(ctx, state.promptType);
  }
  state.step++;
  saveState();
  render();
}

function promptNewProject(){
  // Replace window.prompt() with inline modal — works in iframes/Notion
  const existing = document.getElementById('mpbNewProjectForm');
  if(existing){ existing.remove(); return; }
  const form = document.createElement('div');
  form.id = 'mpbNewProjectForm';
  form.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  form.innerHTML = `

      </div>

    const inp = document.getElementById('mpbNewProjectName');
    if(inp){ inp.focus(); inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submitNewProject(); if(e.key==='Escape') form.remove(); }); }

function submitNewProject(){
  const inp = document.getElementById('mpbNewProjectName');
  const name = inp ? inp.value.trim() : '';
  const form = document.getElementById('mpbNewProjectForm');
  if(!name){ if(inp) inp.focus(); return; }
  if(form) form.remove();
  createProject(name);
  render();
}

function doRestart(){
  const modal = document.getElementById('mpbConfirmReset');

  localStorage.removeItem(STORAGE_KEY);
  state = {promptType:'',step:0,values:{},snapshots:[]};

function saveSnapshotOnly(){

function saveToProject(projectId){
  // Save the current built prompt to a specific project
  const title = getVal('suggestedTitle') || suggestTitle();
  const promptText = getVal('builtPrompt','');
  if(!promptText){ alert('Build the prompt first.'); return; }
  if(projectId === '__new__'){
    // Show new project modal, then save on submit
    state.values._pendingSavePrompt = true;
    saveState();
    promptNewProject();
    return;
  }
  if(projectId) setActiveProject(projectId);
  logStageToProject(state.promptType, title, promptText);
  renderTracker();
  // Show confirmation on the save button
  const btn = document.querySelector('[data-save-project]');
  if(btn){ const orig=btn.textContent; btn.textContent='Saved to project ✓'; setTimeout(()=>btn.textContent=orig,2000); }
}

function buildSaveToProjectDropdown(){
  const projects = loadProjects();
  const active = projects.find(p=>p.active);
  const promptType = state.promptType;
  const alreadySaved = active && active.stages && active.stages[promptType];

  if(!projects.length){
    return `<button class="btn" onclick="promptNewProject()" style="border-color:var(--gold-mid);color:var(--gold)">+ Create project to save</button>`;
  }

  const opts = projects.map(p =>
    `<option value="${p.id}" ${p.active?'selected':''}>${escapeHtml(p.name)}${p.active?' (active)':''}</option>`
  ).join('');

  return `
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select id="saveProjectSelect" class="select" style="width:auto;font-size:13px;padding:8px 10px">
        ${opts}
        <option value="__new__">+ New project…</option>
      </select>
      <button class="btn" data-save-project style="border-color:var(--gold-mid);color:var(--gold);font-weight:600"
        onclick="saveToProject(document.getElementById('saveProjectSelect').value)">

}

            <div class="project-btn-row">
              ${!p.active ? `<button class="btn" onclick="setActiveProject('${p.id}');render()">Set active</button>` : ''}
              <button class="btn" onclick="confirmDeleteProject('${p.id}')" style="color:#c0392b;border-color:#c0392b">Delete</button>
            </div>
          </div>
        </div>`).join('') : '<p style="color:var(--muted);font-size:14px">No projects yet.</p>'}
      <div class="nav" style="margin-top:16px"><button class="btn" onclick="render()">← Back</button></div>
    </div>`;
}

function renderTracker(){
  const projects = loadProjects();
  const mount = document.getElementById('trackerMount');
  if(!mount) return;
  if(!projects.length){
    mount.innerHTML = `<div class="callout blue">No projects yet. Create a project on Step 1 to start tracking your Idea → Hook → Script pipeline.</div>`;
    return;
  }
  mount.innerHTML = projects.map(p => {
    const stages = p.stages || {};
    const pipeline = PIPELINE_STAGES.map((s,i) => {
      const done = !!stages[s];
      const isLast = i === PIPELINE_STAGES.length - 1;
      const arrow = !isLast ? `<span class="pipe-arrow">→</span>` : '';
      const nodeClass = done ? 'done' : '';
      const shortTitle = done ? stages[s].title.split(' — ').slice(0,2).join(' — ') : 'not built';
      const expandId = `stage_${p.id}_${s}`;
      return `<div class="pipe-stage">
          <div class="stage-node ${nodeClass}" onclick="toggleStageExpand('${expandId}')" style="cursor:${done?'pointer':'default'}" title="${done?'Click to preview':'Not built yet'}">
            <span class="stage-label">${s}</span>
            <span class="stage-val">${escapeHtml(shortTitle)}</span>
          </div>${arrow}
        </div>`;
    }).join('');

    const stageDetails = PIPELINE_STAGES.filter(s => stages[s]).map(s => `
      <div id="stage_${p.id}_${s}" class="stage-expand">
        <div style="font-size:12px;font-weight:600;color:var(--dark);margin-bottom:4px">${s.charAt(0).toUpperCase()+s.slice(1)} — ${escapeHtml(stages[s].title)}</div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:8px">Saved ${new Date(stages[s].savedAt).toLocaleString()}</div>
        <div class="stage-prompt-preview">${escapeHtml((stages[s].prompt||'').slice(0,400))}${(stages[s].prompt||'').length>400?'\n…':''}</div>
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" style="font-size:12px;padding:5px 10px" onclick="copyText(loadProjects().find(x=>x.id==='${p.id}').stages['${s}'].prompt||'')">Copy prompt</button>
          <button class="btn" style="font-size:12px;padding:5px 10px" onclick="loadStageAsContext('${s}','${p.id}')">Use as context →</button>
        </div>
      </div>`).join('');

    return `<div class="project-card">
      <div class="project-card-header">
        <div>
          <div class="project-name">${escapeHtml(p.name)}${p.active?' <span style="font-size:11px;color:var(--green);font-weight:400">(active)</span>':''}</div>
          <div class="project-meta">Created ${new Date(p.createdAt).toLocaleDateString()} · ${Object.keys(stages).length}/3 pipeline stages complete</div>
        </div>
        <div class="project-btn-row">
          ${!p.active?`<button class="btn" style="font-size:12px;padding:5px 10px" onclick="setActiveProject('${p.id}');renderTracker()">Set active</button>`:''}
          ${p.active && state.promptType && PIPELINE_STAGES.includes(state.promptType) ? `<button class="btn" style="font-size:12px;padding:5px 10px;border-color:var(--gold-mid);color:var(--gold)" onclick="saveToProject('${p.id}')">Save current build</button>` : ''}
          <button class="btn" style="font-size:12px;padding:5px 10px;color:#c0392b;border-color:#c0392b" onclick="confirmDeleteProject('${p.id}')">Delete</button>
        </div>
      </div>
      <div class="pipeline">${pipeline}</div>
      ${stageDetails}
    </div>`;
  }).join('');
}

function toggleStageExpand(id){
  const el = document.getElementById(id);
  if(el) el.classList.toggle('open');
}

function loadStageAsContext(stageType, projectId){
  const projects = loadProjects();
  const proj = projects.find(p => p.id === projectId);
  if(!proj || !proj.stages[stageType]) return;
  const promptText = proj.stages[stageType].prompt || '';
  state = { promptType:'', step:0, values:{ ctx_raw: promptText }, snapshots: state.snapshots||[] };
  saveState();
  window.scrollTo(0,0);
  render();
  setTimeout(()=>{
    const ctxBox = document.getElementById('ctxBox');
    const ctxInput = document.getElementById('ctxInput');
    if(ctxBox) ctxBox.classList.remove('hidden');
    if(ctxInput) ctxInput.value = promptText;
  }, 50);
}

function confirmDeleteProject(id){
  const projects = loadProjects();
  const proj = projects.find(p=>p.id===id);
  if(!proj) return;
  const existing = document.getElementById('mpbConfirmDelete');
  if(existing) existing.remove();
  const modal = document.createElement('div');
  modal.id = 'mpbConfirmDelete';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  modal.innerHTML = `
    <div style="background:#fff;border-radius:16px;padding:28px 28px 24px;max-width:380px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.22)">
      <div style="font-size:15px;font-weight:600;color:var(--dark);margin-bottom:10px">Delete project?</div>
      <div style="font-size:14px;color:var(--muted);margin-bottom:20px">"${escapeHtml(proj.name)}" and all its saved stage prompts will be permanently removed.</div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn" onclick="document.getElementById('mpbConfirmDelete').remove()">Cancel</button>
        <button class="btn" style="background:#c0392b;color:#fff;border-color:#c0392b" onclick="document.getElementById('mpbConfirmDelete').remove();deleteProject('${id}');renderTracker()">Delete</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

render();

// Expose all onclick-callable functions to window (required for sandboxed iframes)
window.selectType = selectType;
window.toggleArray = toggleArray;
window.nextStep = nextStep;
window.prevStep = prevStep;
window.buildOutput = buildOutput;
window.copyText = copyText;
window.copyFullSummary = copyFullSummary;
window.sendPrompt = sendPrompt;
window.saveSnapshotOnly = saveSnapshotOnly;
window.showSnapshots = showSnapshots;
window.render = render;
window.applyCtxAndContinue = applyCtxAndContinue;
window.promptNewProject = promptNewProject;
window.submitNewProject = submitNewProject;
window.confirmRestart = confirmRestart;
window.doRestart = doRestart;
window.saveToProject = saveToProject;
window.showProjectPicker = showProjectPicker;
window.setActiveProject = setActiveProject;
window.deleteProject = deleteProject;
window.renderTracker = renderTracker;
window.toggleStageExpand = toggleStageExpand;
window.loadStageAsContext = loadStageAsContext;
window.confirmDeleteProject = confirmDeleteProject;
</script>
</body>
</html>
