<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Prompt Builder — v0.5</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap');
:root{--bg:#f2f0eb;--white:#fff;--dark:#1a1917;--ink:#2a2826;--muted:#6f6d69;--border:#dddbd6;--border2:#c5c2bc;--gold:#b5830a;--gold-light:#fdf4e3;--gold-border:#e8c96a;--gold-mid:#d4a017;--amber:#7a4f0a;--amber-bg:#fdf4e3;--green:#1a6b3a;--green-bg:#edf7f1;--green-border:#a8d9bc;--blue:#1a3a6b;--blue-bg:#e8f0fb;--blue-border:#a8c0e8;--c-type:#1a3a6b;--c-found:#2d6a4f;--c-strat:#b5830a;--c-aud:#6b3fa0;--c-fmt:#1a6b5a;--c-con:#8b3a1a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);background-image:radial-gradient(ellipse at 20% 0%,rgba(181,131,10,.07) 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(26,58,107,.06) 0%,transparent 60%);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:15px;line-height:1.7;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:0 20px 80px}
.header{background:linear-gradient(135deg,#1a1917 0%,#2c2620 60%,#1a2a1a 100%);border-radius:0 0 20px 20px;margin:0 -20px 32px;padding:36px 36px 30px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 10% 50%,rgba(181,131,10,.18) 0%,transparent 55%),radial-gradient(ellipse at 90% 20%,rgba(45,106,79,.15) 0%,transparent 50%);pointer-events:none}
.h-eye{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:10px}
.header h1{font-size:34px;line-height:1.08;color:#fff;margin-bottom:10px}
.header p{font-size:14px;color:rgba(255,255,255,.6);max-width:580px}
.badge{font-family:'IBM Plex Mono',monospace;font-size:11px;border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);white-space:nowrap;position:relative;z-index:1;flex-shrink:0}
.progress{display:grid;gap:7px;margin:0 0 24px}
.progress-bar{display:grid;grid-template-columns:repeat(var(--steps,6),1fr);gap:5px}
.seg{height:5px;background:var(--border);border-radius:999px;transition:background .3s}
.seg.active{background:linear-gradient(90deg,var(--gold-mid),var(--gold))}
.meta{font-size:13px;color:var(--muted)}
.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:16px 16px 0 0}
.card h2{font-size:16px;color:var(--dark);margin-bottom:6px;font-weight:600}
.card p{font-size:14px;color:var(--muted)}
.card[data-step="type"]::before{background:linear-gradient(90deg,var(--c-type),#2d5abf)}
.card[data-step="foundation"]::before{background:linear-gradient(90deg,var(--c-found),#52b788)}
.card[data-step="strategy"]::before,.card[data-step="mechanics"]::before,.card[data-step="iteration"]::before{background:linear-gradient(90deg,var(--c-strat),#f0c040)}
.card[data-step="audience"]::before,.card[data-step="voice"]::before{background:linear-gradient(90deg,var(--c-aud),#9b6dcc)}
.card[data-step="format"]::before,.card[data-step="structure"]::before,.card[data-step="context"]::before{background:linear-gradient(90deg,var(--c-fmt),#40c9a2)}
.card[data-step="constraints"]::before{background:linear-gradient(90deg,var(--c-con),#d4602a)}
.card[data-step="output"]::before{background:linear-gradient(90deg,var(--c-found),#52b788)}
.card[data-step="role"]::before{background:linear-gradient(90deg,var(--c-type),#2d5abf)}
.card[data-step="tools"]::before{background:linear-gradient(90deg,var(--muted),var(--border2))}
.section-title{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.section-title::after{content:'';height:1px;background:linear-gradient(90deg,var(--border2),transparent);flex:1}
.grid{display:grid;gap:12px}
.grid.four{grid-template-columns:repeat(4,1fr)}
.type-card,.tag{border:1px solid var(--border2);border-radius:12px;background:var(--white);cursor:pointer;transition:all .18s ease}
.type-card{padding:16px;min-height:116px;position:relative;overflow:hidden}
.type-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--tc-color,var(--border));transition:opacity .18s;opacity:0}
.type-card:hover::after{opacity:1}
.type-card:hover{border-color:var(--tc-color,var(--dark));box-shadow:0 2px 8px rgba(0,0,0,.08);transform:translateY(-1px)}
.type-card.active{background:var(--dark);color:#fff;border-color:var(--dark);box-shadow:0 4px 14px rgba(0,0,0,.18);transform:translateY(-1px)}
.type-card.active::after{opacity:0}
.type-card .icon{font-size:22px;margin-bottom:8px}
.type-card .name{font-weight:600;margin-bottom:5px;font-size:14px}
.type-card .desc{font-size:12px;line-height:1.5;color:var(--muted)}
.type-card.active .desc{color:rgba(255,255,255,.7)}
.type-card[data-type="idea"]{--tc-color:#b5830a}
.type-card[data-type="hook"]{--tc-color:#1a3a6b}
.type-card[data-type="script"]{--tc-color:#2d6a4f}
.type-card[data-type="generator"]{--tc-color:#6b3fa0}
.type-card[data-type="analysis"]{--tc-color:#8b3a1a}
.type-card[data-type="workflow"]{--tc-color:#1a6b5a}
.type-card[data-type="framework"]{--tc-color:#1a3a6b}
.type-card[data-type="tooling"]{--tc-color:#2d6a4f}
.field{margin-bottom:20px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--dark);margin-bottom:8px}
.field .hint{font-size:12px;color:var(--muted);margin-top:6px}
.input,.select,.textarea{width:100%;border:1px solid var(--border2);background:var(--white);border-radius:10px;padding:11px 13px;font:inherit;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--gold-mid);box-shadow:0 0 0 3px rgba(212,160,23,.12)}
.textarea{min-height:110px;resize:vertical}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:8px 13px;font-size:13px;background:var(--bg);border-radius:10px;color:var(--ink)}
.tag:hover{border-color:var(--gold-mid);background:#fff}
.tag.active{background:var(--dark);color:#fff;border-color:var(--dark);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--border2);background:var(--white);color:var(--ink);border-radius:10px;padding:10px 16px;font:inherit;font-size:13px;cursor:pointer;transition:all .15s}
.btn:hover{border-color:var(--dark);background:var(--bg)}
.btn.primary{background:linear-gradient(135deg,#1a1917 0%,#2c2620 100%);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.btn.primary:hover{box-shadow:0 3px 12px rgba(0,0,0,.28);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.callout{border-radius:0 10px 10px 0;padding:13px 16px;margin:12px 0;font-size:13px;line-height:1.65;display:flex;gap:10px;align-items:flex-start}
.callout.blue{background:var(--blue-bg);border-left:3px solid var(--blue);color:var(--blue)}
.callout.amber{background:var(--amber-bg);border-left:3px solid var(--gold-mid);color:var(--amber)}
.callout.green{background:var(--green-bg);border-left:3px solid var(--green);color:var(--green)}
.code{background:linear-gradient(160deg,#1a1917 0%,#232018 100%);border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.06);box-shadow:0 4px 20px rgba(0,0,0,.18)}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.code-head span{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.38)}
.code-head button{background:rgba(212,160,23,.15);color:rgba(255,220,100,.9);border:1px solid rgba(212,160,23,.3);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:12px;transition:all .15s}
.code-head button:hover{background:rgba(212,160,23,.28);color:#fff}
.code-body{padding:20px;font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:1.85;white-space:pre-wrap;color:rgba(255,255,255,.85);max-height:420px;overflow:auto}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kv{background:linear-gradient(135deg,var(--bg) 0%,#ede9e0 100%);border:1px solid var(--border);border-radius:10px;padding:13px}
.kv .k{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.kv .v{font-size:13px;color:var(--dark);line-height:1.5;font-weight:500}
.summary-layer{background:var(--white);border:1px solid var(--border);border-left:3px solid var(--gold-border);border-radius:0 12px 12px 0;padding:16px;margin-top:10px}
.summary-layer-label{font-weight:600;color:var(--dark);margin-bottom:8px;font-size:14px}
.summary-layer-row{display:grid;grid-template-columns:180px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.summary-layer-row:last-child{border-bottom:none}
.slr-k{font-size:13px;color:var(--muted)}
.slr-v{font-size:13px;color:var(--ink);font-weight:500}
.small{font-size:12px;color:var(--muted)}
.hidden{display:none!important}
.tracker-wrap{margin-top:48px;padding:28px 28px 32px;background:var(--white);border:1px solid var(--border);border-radius:20px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.04);position:relative;overflow:hidden}
.tracker-wrap::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--c-found),var(--gold-mid),var(--c-type));border-radius:20px 20px 0 0}
.tracker-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
.tracker-actions{display:flex;gap:8px;flex-wrap:wrap}
.project-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:10px}
.project-card:last-child{margin-bottom:0}
.project-card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.project-name{font-size:14px;font-weight:600;color:var(--dark)}
.project-meta{font-size:12px;color:var(--muted);margin-top:2px}
.project-btn-row{display:flex;gap:6px;flex-shrink:0}
.pipeline{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.pipe-stage{display:flex;align-items:center;gap:8px}
.stage-node{border:1px solid var(--border2);border-radius:10px;padding:8px 14px;font-size:12px;color:var(--muted);background:var(--white);min-width:90px;text-align:center;line-height:1.35;transition:all .18s}
.stage-node .stage-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:3px}
.stage-node .stage-val{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.stage-node.done{background:linear-gradient(135deg,#2d6a4f,#1a4a35);border-color:#1a4a35;color:#fff;box-shadow:0 2px 8px rgba(45,106,79,.3)}
.stage-node.done .stage-label{color:rgba(255,255,255,.6)}
.stage-node.done .stage-val{color:rgba(255,255,255,.75)}
.stage-node.done:hover{box-shadow:0 3px 12px rgba(45,106,79,.4);transform:translateY(-1px)}
.pipe-arrow{color:var(--gold-border);font-size:16px;flex-shrink:0}
.stage-expand{display:none;margin-top:12px;border-top:1px solid var(--border);padding-top:12px}
.stage-expand.open{display:block}
.stage-prompt-preview{font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.65;white-space:pre-wrap;max-height:150px;overflow:auto;background:var(--dark);color:rgba(255,255,255,.75);border-radius:8px;padding:12px 14px}
.ctx-toggle{font-size:13px;color:var(--gold);cursor:pointer;background:none;border:none;padding:0;font-family:inherit;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--gold-border)}
.ctx-box{background:linear-gradient(135deg,#fdf8ec,#fdf4e3);border:1px solid var(--gold-border);border-radius:12px;padding:16px 18px;margin:12px 0 6px}
.ctx-box label{font-size:13px;font-weight:600;color:var(--amber);display:block;margin-bottom:8px}
.ctx-box textarea{width:100%;min-height:90px;resize:vertical;border:1px solid var(--gold-border);border-radius:8px;padding:10px 12px;font:12px/1.6 'IBM Plex Mono',monospace;color:var(--ink);background:rgba(255,255,255,.8)}
.ctx-box .hint{font-size:12px;color:var(--amber);margin-top:8px;opacity:.8}
#guideBtn:hover{box-shadow:0 6px 22px rgba(0,0,0,.38);transform:translateY(-2px)}
@media(max-width:760px){.grid.four,.summary-grid{grid-template-columns:1fr 1fr}.header{border-radius:0 0 14px 14px;padding:28px 20px 24px;margin:0 -20px 24px}.header h1{font-size:26px}.summary-layer-row{grid-template-columns:1fr}.pipeline{flex-direction:column}.pipe-arrow{transform:rotate(90deg)}.tracker-wrap{padding:20px 16px 24px}}
@media(max-width:480px){.grid.four{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <div class="h-eye">Content Studio — Prompt Builder</div>
      <h1>Master Prompt Builder</h1>
      <p>Step-by-step prompt engineering for consistent, structured AI output. Idea → Hook → Script pipeline with project tracking.</p>
    </div>
    <div class="badge">v0.5</div>
  </div>
  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
    <div class="meta" id="progressMeta">Step 1 of 6</div>
  </div>
  <div id="app"></div>
  <div class="tracker-wrap">
    <div class="tracker-header">
      <div class="section-title" style="margin-bottom:0;flex:1">Project pipeline tracker</div>
      <div class="tracker-actions">
        <button class="btn" style="font-size:12px;padding:6px 12px" onclick="promptNewProject()">+ New project</button>
        <button class="btn" style="font-size:12px;padding:6px 12px" onclick="showProjectPicker()">Manage</button>
      </div>
    </div>
    <div id="trackerMount"></div>
  </div>
</div>
<a href="guide.html" target="_blank" rel="noopener" id="guideBtn" style="position:fixed;bottom:28px;right:24px;z-index:999;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#1a1917,#2c2620);color:#fff;text-decoration:none;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;padding:10px 18px;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12);transition:all .18s ease">📖 User Guide</a>
<script>
const SK='mpb_v05',TK='mpb_proj_v05',STAGES=['idea','hook','script'];
const TM={idea:{label:'Idea',icon:'✦',desc:'Generate content ideas, spot trends, find angles'},hook:{label:'Hook',icon:'↗',desc:'Write scroll-stopping opening lines'},script:{label:'Script',icon:'▣',desc:'Full carousel or video scripts'},generator:{label:'Generator',icon:'∞',desc:'Captions, hooks, or multi-format output'},analysis:{label:'Analysis',icon:'◌',desc:'Audience research and performance analysis'},workflow:{label:'Workflow',icon:'⇄',desc:'Multi-step process or automation prompts'},framework:{label:'Framework',icon:'□',desc:'Reusable prompt structures and templates'},tooling:{label:'Tooling',icon:'⚙',desc:'Business, lead gen, and operational prompts'}};
const OPT={platforms:['Instagram','TikTok','YouTube','LinkedIn','Twitter/X','Facebook','Email newsletter','Website / Blog','Any platform'],domains:['Content','Business','Systems','Creative','Research','General'],versions:['V1','V2','V3','V4+'],priorities:['Speed','Simplicity','Cost Efficiency','Quality','Scalability','Accuracy','Originality'],linked:['Idea Vault','Hook Bank','Script Studio','Content Pipeline','Performance Database','Reference Data','Content Themes','Prompt Library'],awareness:['Unaware','Problem aware','Solution aware','Product aware','Most aware'],reasoning:['Fastest path','Step-by-step reasoning','Deep analysis','First principles','Compare options'],selfCheck:['None','Review once before finalizing','Check against constraints','Eliminate generic phrasing','Flag assumptions clearly'],tone:['Empathetic','Direct','Witty','Professional','Urgent','Calm','Confident','Analytical','Conversational'],contentSource:['Authentic','AI-Generated','Hybrid']};
const PATHS={idea:[{key:'type',title:'Select prompt type'},{key:'foundation',title:'Foundation'},{key:'strategy',title:'Trend strategy'},{key:'audience',title:'Audience'},{key:'format',title:'Output format'},{key:'constraints',title:'Constraints'},{key:'iteration',title:'Iteration'}],hook:[{key:'type',title:'Select prompt type'},{key:'foundation',title:'Foundation'},{key:'mechanics',title:'Mechanics'},{key:'audience',title:'Audience'},{key:'constraints',title:'Constraints'},{key:'iteration',title:'Iteration'}],script:[{key:'type',title:'Select prompt type'},{key:'foundation',title:'Foundation'},{key:'structure',title:'Structure'},{key:'voice',title:'Voice'},{key:'constraints',title:'Constraints'},{key:'iteration',title:'Iteration'}],generator:[{key:'type',title:'Select prompt type'},{key:'foundation',title:'Foundation'},{key:'role',title:'Role'},{key:'context',title:'Context'},{key:'constraints',title:'Constraints'},{key:'iteration',title:'Iteration'}]};

function loadState(){try{return JSON.parse(localStorage.getItem(SK));}catch(e){return null;}}
function saveState(){localStorage.setItem(SK,JSON.stringify(state));}
const _s=loadState();
let state={promptType:'',step:0,values:_s?Object.assign({},_s.values,{builtPrompt:'',suggestedTitle:''}):{ },snapshots:_s?(_s.snapshots||[]):[]};

function loadProjects(){try{return JSON.parse(localStorage.getItem(TK))||[];}catch(e){return[];}}
function saveProjects(p){localStorage.setItem(TK,JSON.stringify(p));}
function getActiveProject(){return loadProjects().find(p=>p.active)||null;}
function createProject(name){const ps=loadProjects();ps.forEach(p=>p.active=false);const p={id:Date.now()+'',name:name||'Untitled',createdAt:new Date().toISOString(),active:true,stages:{}};ps.unshift(p);saveProjects(ps);return p;}
function logStageToProject(type,title,prompt){if(!STAGES.includes(type))return;const ps=loadProjects(),p=ps.find(x=>x.active);if(!p)return;p.stages[type]={title,prompt,savedAt:new Date().toISOString()};saveProjects(ps);}
function setActiveProject(id){const ps=loadProjects();ps.forEach(p=>p.active=(p.id===id));saveProjects(ps);}
function deleteProject(id){saveProjects(loadProjects().filter(p=>p.id!==id));}

function getPath(){return PATHS[state.promptType]||PATHS.generator;}
function curStep(){return getPath()[state.step]||getPath()[0];}
function setVal(k,v){state.values[k]=v;saveState();}
function getVal(k,fb=''){return state.values[k]??fb;}
function arrVal(k){const v=state.values[k];return Array.isArray(v)?v:[];}
function eH(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function eA(s){return eH(s).replace(/`/g,'&#96;');}

function toggleArray(k,v,single,max){
  let a=arrVal(k).slice();
  if(single){a=a[0]===v?[]:[v];}
  else{a=a.includes(v)?a.filter(x=>x!==v):[...a,v];if(max&&a.length>max)a=a.slice(a.length-max);}
  setVal(k,a);render();
}

function tags(label,key,items,single,max,hint){
  return '<div class="field"><label>'+label+'</label><div class="tags">'+items.map(item=>{
    const act=arrVal(key).includes(item);
    return '<button type="button" class="tag'+(act?' active':'')+'" onclick="toggleArray(\x27'+key+'\x27,\x27'+String(item).replace(/\x27/g,'\\\x27')+'\x27,'+(single?'true':'false')+','+(max||'null')+')">'+eH(item)+'</button>';
  }).join('')+'</div>'+(hint?'<div class="hint">'+hint+'</div>':'')+'</div>';
}
function inp(label,key,ph,hint){return '<div class="field"><label for="'+key+'">'+label+'</label><input class="input" id="'+key+'" type="text" placeholder="'+eA(ph)+'" value="'+eA(getVal(key,''))+'" oninput="setVal(\x27'+key+'\x27,this.value)">'+(hint?'<div class="hint">'+hint+'</div>':'')+'</div>';}
function ta(label,key,ph,hint){return '<div class="field"><label for="'+key+'">'+label+'</label><textarea class="textarea" id="'+key+'" placeholder="'+eA(ph)+'" oninput="setVal(\x27'+key+'\x27,this.value)">'+eH(getVal(key,''))+'</textarea>'+(hint?'<div class="hint">'+hint+'</div>':'')+'</div>';}
function sel(label,key,items,hint){return '<div class="field"><label for="'+key+'">'+label+'</label><select class="select" id="'+key+'" onchange="setVal(\x27'+key+'\x27,this.value)"><option value="">Select\u2026</option>'+items.map(i=>'<option value="'+eA(i)+'"'+(getVal(key,'')==i?' selected':'')+'>'+eH(i)+'</option>').join('')+'</select>'+(hint?'<div class="hint">'+hint+'</div>':'')+'</div>';}
function typeGrid(){return '<div class="grid four">'+Object.entries(TM).map(([k,m])=>'<button type="button" class="type-card'+(state.promptType===k?' active':'')+'" data-type="'+k+'" onclick="selectType(\x27'+k+'\x27)"><div class="icon">'+m.icon+'</div><div class="name">'+m.label+'</div><div class="desc">'+m.desc+'</div></button>').join('')+'</div>';}
function nav(back,next,nextFn){return '<div class="nav">'+(back?'<button class="btn" onclick="prevStep()">Back</button>':'<div></div>')+'<button class="btn primary" onclick="'+nextFn+'">'+next+'</button></div>';}

function selectType(t){state.promptType=t;state.step=0;setVal('promptTypeLabel',TM[t].label);saveState();render();}

function validateStep(){
  const s=curStep().key;
  if(s==='type')return!!state.promptType;
  if(s==='foundation'){
    if(state.promptType==='idea')return!!getVal('idea_topic')&&arrVal('idea_platforms').length&&arrVal('idea_goals').length;
    if(state.promptType==='hook')return!!getVal('hook_topic')&&arrVal('hook_destination').length;
    if(state.promptType==='script')return!!getVal('script_topic')&&arrVal('script_format').length;
    return!!getVal('gen_outcome')&&!!getVal('gen_domain');
  }
  if(s==='iteration')return!!arrVal('iter_domain').length&&!!getVal('iter_version');
  return true;
}
function nextStep(){if(!validateStep()){alert('Complete the required fields first.');return;}if(state.step<getPath().length-1){state.step++;saveState();render();}}
function prevStep(){if(state.step>0){state.step--;saveState();render();}}

function buildPrompt(){
  const t=state.promptType;if(!t)return'';
  const lbl=TM[t].label;
  let p='You are an expert '+lbl.toLowerCase()+' assistant.\n\n';
  if(t==='idea'){
    p+='TASK: Generate '+getVal('idea_volume','10')+' content ideas for the following brief.\n\nNICHE / TOPIC: '+getVal('idea_topic')+'\nPLATFORM: '+arrVal('idea_platforms').join(', ')+'\nCONTENT GOAL: '+arrVal('idea_goals').join(', ')+'\n\n';
    if(arrVal('idea_trend').length)p+='TREND STRATEGY: '+arrVal('idea_trend').join(', ')+'\n';
    if(arrVal('idea_diff').length)p+='DIFFERENTIATION: '+arrVal('idea_diff').join(', ')+'\n';
    if(getVal('idea_avoid_sound'))p+='AVOID SOUNDING LIKE: '+getVal('idea_avoid_sound')+'\n';
    if(arrVal('idea_viral').length)p+='VIRAL FILTER: '+arrVal('idea_viral').join(', ')+'\n';
    if(getVal('idea_audience'))p+='AUDIENCE: '+getVal('idea_audience')+'\n';
    if(arrVal('idea_awareness').length)p+='AWARENESS LEVEL: '+arrVal('idea_awareness').join(', ')+'\n';
    if(arrVal('idea_emotions').length)p+='EMOTIONAL TRIGGERS: '+arrVal('idea_emotions').join(', ')+'\n';
    if(getVal('idea_pain'))p+='PAIN POINTS: '+getVal('idea_pain')+'\n';
    if(arrVal('idea_format').length)p+='OUTPUT FORMAT: '+arrVal('idea_format').join(', ')+'\n';
    if(arrVal('idea_content_formats').length)p+='CONTENT FORMATS: '+arrVal('idea_content_formats').join(', ')+'\n';
    if(arrVal('idea_sort').length)p+='SORT BY: '+arrVal('idea_sort').join(', ')+'\n';
  }
  if(t==='hook'){
    p+='TASK: Generate '+getVal('hook_volume','10')+' hooks.\n\nTOPIC: '+getVal('hook_topic')+'\n';
    if(arrVal('hook_destination').length)p+='DESTINATION: '+arrVal('hook_destination').join(', ')+'\n';
    if(arrVal('hook_mechanics').length)p+='MECHANISMS: '+arrVal('hook_mechanics').join(', ')+'\n';
    if(arrVal('hook_emotions').length)p+='EMOTIONAL TRIGGERS: '+arrVal('hook_emotions').join(', ')+'\n';
    if(arrVal('hook_intensity').length)p+='INTENSITY: '+arrVal('hook_intensity').join(', ')+'\n';
    if(getVal('hook_audience'))p+='AUDIENCE: '+getVal('hook_audience')+'\n';
    if(arrVal('hook_platform').length)p+='PLATFORM: '+arrVal('hook_platform').join(', ')+'\n';
    if(arrVal('hook_tone').length)p+='TONE: '+arrVal('hook_tone').join(', ')+'\n';
    if(getVal('hook_prior_idea'))p+='\nSOURCE IDEA (hooks must be grounded in this):\n'+getVal('hook_prior_idea')+'\n';
  }
  if(t==='script'){
    p+='TASK: Write a complete script.\n\nTOPIC: '+getVal('script_topic')+'\n';
    if(arrVal('script_format').length)p+='FORMAT: '+arrVal('script_format').join(', ')+'\n';
    if(getVal('script_sections'))p+='SECTIONS: '+getVal('script_sections')+'\n';
    if(arrVal('script_goal').length)p+='GOAL: '+arrVal('script_goal').join(', ')+'\n';
    if(arrVal('script_framework').length)p+='FRAMEWORK: '+arrVal('script_framework').join(', ')+'\n';
    if(getVal('script_custom_framework'))p+='CUSTOM FRAMEWORK: '+getVal('script_custom_framework')+'\n';
    if(getVal('script_words_per_section'))p+='WORDS PER SECTION: Max '+getVal('script_words_per_section')+'\n';
    if(arrVal('script_tone').length)p+='TONE: '+arrVal('script_tone').join(', ')+'\n';
    if(getVal('script_voice_desc'))p+='VOICE & STYLE: '+getVal('script_voice_desc')+'\n';
    if(getVal('script_audience'))p+='AUDIENCE: '+getVal('script_audience')+'\n';
    if(getVal('script_prior_hook'))p+='\nOPENING HOOK (use this exact line — do not rewrite):\n'+getVal('script_prior_hook')+'\n';
    if(getVal('script_prior_idea'))p+='\nSOURCE IDEA (script must stay true to this angle):\n'+getVal('script_prior_idea')+'\n';
    const src=arrVal('script_source')[0]||'';
    if(src==='Authentic')p+='\nCONTENT SOURCE — AUTHENTIC:\n- Write conversationally with natural spoken rhythm\n- Include [pause] or [emphasis] cues where a beat matters\n- Every line should sound like something a real creator would say aloud\n';
    if(src==='AI-Generated')p+='\nCONTENT SOURCE — AI GENERATED:\n- Sentences must be clean and complete\n- Use punctuation deliberately to control pacing\n- Avoid contractions that AI voices mispronounce\n- Keep energy consistent throughout\n';
    if(src==='Hybrid')p+='\nCONTENT SOURCE — HYBRID:\n- Write a strong structural draft the creator can edit into their voice\n- Mark lines with [ADD PERSONAL EXAMPLE HERE] where a story would strengthen it\n';
  }
  if(['generator','analysis','workflow','framework','tooling'].includes(t)){
    p+='TASK: '+getVal('gen_outcome')+'\n\n';
    if(getVal('gen_domain'))p+='DOMAIN: '+getVal('gen_domain')+'\n';
    if(arrVal('gen_primary_role').length)p+='PRIMARY ROLE: '+arrVal('gen_primary_role').join(', ')+'\n';
    if(arrVal('gen_secondary_lens').length)p+='SECONDARY LENS: '+arrVal('gen_secondary_lens').join(', ')+'\n';
    if(getVal('gen_expertise'))p+='EXPERTISE LEVEL: '+getVal('gen_expertise')+'\n';
    if(getVal('gen_audience'))p+='AUDIENCE: '+getVal('gen_audience')+'\n';
    if(arrVal('gen_platforms').length)p+='PLATFORM: '+arrVal('gen_platforms').join(', ')+'\n';
    if(getVal('gen_existing'))p+='CONTEXT: '+getVal('gen_existing')+'\n';
  }
  if(arrVal('common_output_format').length)p+='\nRESPONSE FORMAT: '+arrVal('common_output_format').join(', ')+'\n';
  if(arrVal('common_tone').length)p+='TONE: '+arrVal('common_tone').join(', ')+'\n';
  if(getVal('common_words_avoid'))p+='WORDS TO AVOID: '+getVal('common_words_avoid')+'\n';
  if(arrVal('common_reasoning').length)p+='REASONING: '+arrVal('common_reasoning').join(', ')+'\n';
  if(arrVal('common_self_check').length)p+='SELF-CHECK: '+arrVal('common_self_check').join(', ')+'\n';
  if(getVal('common_examples'))p+='\nFEW-SHOT EXAMPLES:\n'+getVal('common_examples')+'\n';
  p+='\nFAIL-SAFES:\n- Work only with the information provided — do not make assumptions about the business, location, services, or audience\n- Do not list missing information or assumptions in your response — just produce the requested output\n- Do not invent facts, claims, or sources\n- Follow the requested output format exactly\n- If the brief is too thin to produce quality output, say so in one sentence and stop\n';
  const ctx=getVal('ctx_carry','')||getVal('ctx_raw','');
  if(ctx)p+='\nPRIOR CONTEXT:\n'+ctx;
  return p.trim();
}

function suggestTitle(){
  const t=TM[state.promptType]?.label||'Prompt';
  const pl=arrVal('idea_platforms')[0]||arrVal('hook_platform')[0]||arrVal('gen_platforms')[0]||arrVal('script_format')[0]||'Any';
  const topic=(getVal('idea_topic')||getVal('hook_topic')||getVal('script_topic')||getVal('gen_outcome')||'General').replace(/\s+/g,' ').trim().split(' ').slice(0,4).join(' ');
  return t+' — '+pl+' — '+topic+' — '+getVal('iter_version','V1');
}

function layerRows(obj){
  return Object.entries(obj).filter(([,v])=>v&&(!Array.isArray(v)||v.length)).map(([k,v])=>'<div class="summary-layer-row"><span class="slr-k">'+eH(k)+'</span><span class="slr-v">'+eH(Array.isArray(v)?v.join(', '):String(v))+'</span></div>').join('');
}

function buildSaveProjectPanel(){
  const ps=loadProjects(),active=ps.find(p=>p.active);
  if(!ps.length)return '<button class="btn" onclick="promptNewProject()" style="border-color:var(--gold-mid);color:var(--gold)">+ Create project to save</button>';
  const opts=ps.map(p=>'<option value="'+p.id+'"'+(p.active?' selected':'')+'>'+eH(p.name)+(p.active?' (active)':'')+' </option>').join('')+'<option value="__new__">+ New project…</option>';
  const already=active&&active.stages&&active.stages[state.promptType];
  return '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><select id="saveProjectSel" class="select" style="width:auto;font-size:13px;padding:8px 10px">'+opts+'</select><button class="btn" id="saveProjectBtn" style="border-color:var(--gold-mid);color:var(--gold);font-weight:600" onclick="saveToProject(document.getElementById(\x27saveProjectSel\x27).value)">'+(already?'↺ Re-save to project':'→ Save to project')+'</button></div>';
}

function buildOutput(){
  if(!validateStep()){alert('Complete the required iteration fields first.');return;}
  const title=suggestTitle();setVal('suggestedTitle',title);
  const prompt=buildPrompt();setVal('builtPrompt',prompt);
  state.snapshots=state.snapshots||[];
  state.snapshots.unshift({title,prompt,at:new Date().toISOString(),notes:getVal('iter_notes','')});
  state.snapshots=state.snapshots.slice(0,10);
  saveState();
  logStageToProject(state.promptType,title,prompt);

  const nf={'Prompt name':title,'Domain':arrVal('iter_domain')[0]||'— select in Notion','Prompt type':TM[state.promptType]?.label||'','Platform':arrVal('idea_platforms')[0]||arrVal('hook_platform')[0]||arrVal('gen_platforms')[0]||'—','Version':getVal('iter_version','—'),'Score':arrVal('iter_score')[0]||'— fill after testing','Status':'Draft','Priority':arrVal('iter_priority').join(', ')||'—','Linked to':arrVal('iter_linked').join(', ')||'—','Notes':getVal('iter_notes','—')};

  if(state.promptType==='script')layers.push(['Foundation',{Topic:getVal('script_topic'),Format:arrVal('script_format'),Sections:getVal('script_sections'),Goal:arrVal('script_goal'),'Content source':arrVal('script_source'),'Prior hook':getVal('script_prior_hook'),'Prior idea':getVal('script_prior_idea')}],['Structure',{Framework:arrVal('script_framework'),'Custom framework':getVal('script_custom_framework'),'Words per section':getVal('script_words_per_section')}],['Voice',{Tone:arrVal('script_tone'),'Voice description':getVal('script_voice_desc'),Audience:getVal('script_audience')}]);

    '<div class="card" data-step="output"><div class="section-title">Assembled prompt</div><div class="code"><div class="code-head"><span>Prompt output</span><button onclick="copyText(getVal(\x27builtPrompt\x27))">Copy prompt</button></div><div class="code-body">'+eH(prompt)+'</div></div></div>'+
    '<div class="card" data-step="output"><div class="section-title">Notion prompt library — full summary</div><div class="summary-grid">'+Object.entries(nf).map(([k,v])=>'<div class="kv"><div class="k">'+eH(k)+'</div><div class="v">'+eH(v)+'</div></div>').join('')+'</div>'+layers.map(([lbl,obj])=>{const r=layerRows(obj);return r?'<div class="summary-layer"><div class="summary-layer-label">'+eH(lbl)+'</div>'+r+'</div>':'';}).join('')+'<div class="callout blue"><strong>How to use in Notion:</strong> Open Prompt Library → new entry → paste title → fill field values → paste full prompt into page body.</div>'+(getVal('ctx_carry','')||getVal('ctx_raw','')?'<div class="callout amber">⚠️ <strong>Prior context was carried in</strong> — appended to the prompt above.</div>':'')+
    '<div style="margin-top:16px;padding:14px 16px;background:var(--gold-light);border:1px solid var(--gold-border);border-radius:10px"><div style="font-family:IBM Plex Mono,monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);margin-bottom:10px">Save to project</div>'+buildSaveProjectPanel()+'</div>'+
    '<div class="nav"><button class="btn" onclick="prevStep();render()">← Back to iteration</button><button class="btn" onclick="copyFullSummary()">Copy all fields</button><button class="btn" onclick="sendPrompt()">Send to Claude ↗</button><button class="btn" onclick="copyText(getVal(\x27builtPrompt\x27))">Copy prompt</button><button class="btn primary" onclick="confirmRestart()">Build another</button></div><div class="small" style="margin-top:10px">Snapshots saved: '+(state.snapshots||[]).length+'</div></div>'+
    '<div class="card" data-step="tools"><div class="section-title">Session tools</div><div class="nav"><button class="btn" onclick="saveSnapshotOnly()">Save snapshot</button><button class="btn" onclick="showSnapshots()">View snapshots</button></div></div>';
  renderTracker();
}

async function copyText(txt){
  if(!txt)return;
  function fb(){const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0;';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');alert('Copied.');}catch(e){alert('Copy failed. Please copy manually.');}document.body.removeChild(ta);}
  if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(txt);alert('Copied.');}catch(e){fb();}}else fb();
}

function copyFullSummary(){
  const title=getVal('suggestedTitle'),prompt=getVal('builtPrompt');
  const fields=Array.from(document.querySelectorAll('.kv')).map(el=>el.querySelector('.k').innerText+': '+el.querySelector('.v').innerText).join('\n');
  const layers=Array.from(document.querySelectorAll('.summary-layer')).map(l=>'['+l.querySelector('.summary-layer-label').innerText+']\n'+Array.from(l.querySelectorAll('.summary-layer-row')).map(r=>r.querySelector('.slr-k').innerText+': '+r.querySelector('.slr-v').innerText).join('\n')).join('\n\n');
  copyText('══════════════════════════════\nPROMPT LIBRARY ENTRY\n══════════════════════════════\nNAME: '+title+'\n\nNOTION FIELDS\n──────────────────────────────\n'+fields+'\n\nBUILD NOTES\n──────────────────────────────\n'+layers+'\n\n══════════════════════════════\nFULL PROMPT\n══════════════════════════════\n'+prompt);
}

function sendPrompt(){copyText(getVal('builtPrompt'));alert('Prompt copied. Paste it into Claude or your target AI tool.');}

function render(){
  const path=getPath();
  document.documentElement.style.setProperty('--steps',path.length);
  document.getElementById('progressBar').innerHTML=path.map((_,i)=>'<div class="seg'+(i<=state.step?' active':'')+'"></div>').join('');
  document.getElementById('progressMeta').textContent='Step '+(state.step+1)+' of '+path.length+' — '+path[state.step].title;
  document.getElementById('app').innerHTML=renderStep()+'<div class="card" data-step="tools"><div class="section-title">Session tools</div><div class="nav"><button class="btn" onclick="saveSnapshotOnly()">Save snapshot</button><button class="btn" onclick="showSnapshots()">View snapshots</button><button class="btn" onclick="confirmRestart()">Reset builder</button></div></div>';
  renderTracker();
}

function saveSnapshotOnly(){
  if(!state.promptType){const b=document.querySelector('[onclick="saveSnapshotOnly()"]');if(b){const o=b.textContent;b.textContent='Select a type first';setTimeout(()=>b.textContent=o,2000);}return;}
  const p=buildPrompt();if(!p.trim()){const b=document.querySelector('[onclick="saveSnapshotOnly()"]');if(b){const o=b.textContent;b.textContent='Add content first';setTimeout(()=>b.textContent=o,2000);}return;}
  state.snapshots=state.snapshots||[];
  state.snapshots.unshift({title:suggestTitle(),prompt:p,at:new Date().toISOString(),notes:getVal('iter_notes','')});
  state.snapshots=state.snapshots.slice(0,10);saveState();
  const b=document.querySelector('[onclick="saveSnapshotOnly()"]');if(b){const o=b.textContent;b.textContent='Saved ✓';setTimeout(()=>b.textContent=o,1800);}
}

function showSnapshots(){
  const snaps=state.snapshots||[];
  document.getElementById('app').innerHTML='<div class="card"><div class="section-title">Saved snapshots</div>'+(snaps.length?snaps.map((s,i)=>'<div class="summary-layer"><div class="summary-layer-label">'+eH(s.title||'Untitled')+'</div><div class="summary-layer-row"><span class="slr-k">Saved</span><span class="slr-v">'+eH(new Date(s.at).toLocaleString())+'</span></div><div class="summary-layer-row"><span class="slr-k">Notes</span><span class="slr-v">'+eH(s.notes||'—')+'</span></div><div class="nav" style="margin-top:10px"><button class="btn" onclick="copyText(state.snapshots['+i+'].prompt)">Copy prompt</button></div></div>').join(''):'<p style="color:var(--muted)">No snapshots saved yet.</p>')+'<div class="nav" style="margin-top:16px"><button class="btn" onclick="render()">← Back</button></div></div>';
}

function eH(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function eA(s){return eH(s).replace(/`/g,'&#96;');}

function applyCtxAndContinue(){
  if(!validateStep()){alert('Select a prompt type first.');return;}
  const ci=document.getElementById('ctxInput');
  if(ci&&ci.value.trim()){
    setVal('ctx_raw',ci.value);
    const raw=ci.value.trim(),out={};
    const tm=raw.match(/(?:TOPIC|NICHE[^:]*)?:\s*(.+)/i);if(tm)out.topic=tm[1].trim();
    const pm=raw.match(/PLATFORM:\s*(.+)/i);if(pm)out.platforms=pm[1].split(/,\s*/).map(s=>s.trim());
    const am=raw.match(/AUDIENCE:\s*(.+)/i);if(am)out.audience=am[1].trim();
    if(out.topic){if(state.promptType==='idea')setVal('idea_topic',out.topic);else if(state.promptType==='hook')setVal('hook_topic',out.topic);else if(state.promptType==='script')setVal('script_topic',out.topic);}
    if(out.audience){if(state.promptType==='idea')setVal('idea_audience',out.audience);else if(state.promptType==='hook')setVal('hook_audience',out.audience);else if(state.promptType==='script')setVal('script_audience',out.audience);}
    setVal('ctx_carry',raw);
  }
  state.step++;saveState();render();
}

function showModal(id,html){
  const ex=document.getElementById(id);if(ex){ex.remove();return;}
  const m=document.createElement('div');m.id=id;
  m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  m.innerHTML=html;document.body.appendChild(m);
}

function promptNewProject(){
  showModal('mpbNPF','<div style="background:#fff;border-radius:16px;padding:28px;max-width:420px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.22)"><div style="font-family:IBM Plex Mono,monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px">New project</div><div style="font-size:15px;font-weight:600;color:var(--dark);margin-bottom:16px">Name this project</div><input id="mpbNPI" type="text" class="input" placeholder="e.g. Bookkeeping Reel — March" style="margin-bottom:16px" autofocus><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" onclick="document.getElementById(\x27mpbNPF\x27).remove()">Cancel</button><button class="btn primary" onclick="submitNewProject()">Create</button></div></div>');
  setTimeout(()=>{const i=document.getElementById('mpbNPI');if(i){i.focus();i.addEventListener('keydown',e=>{if(e.key==='Enter')submitNewProject();if(e.key==='Escape')document.getElementById('mpbNPF')?.remove();});}},30);
}

function submitNewProject(){
  const i=document.getElementById('mpbNPI'),name=i?i.value.trim():'';
  if(!name){if(i)i.focus();return;}
  document.getElementById('mpbNPF')?.remove();
  createProject(name);render();
}

function confirmRestart(){
  showModal('mpbCR','<div style="background:#fff;border-radius:16px;padding:28px;max-width:380px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.22)"><div style="font-size:15px;font-weight:600;color:var(--dark);margin-bottom:10px">Reset builder?</div><div style="font-size:14px;color:var(--muted);margin-bottom:20px">Clears current progress and fields. Snapshots and projects are kept.</div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" onclick="document.getElementById(\x27mpbCR\x27).remove()">Cancel</button><button class="btn" style="background:#c0392b;color:#fff;border-color:#c0392b" onclick="doRestart()">Reset</button></div></div>');
}

function doRestart(){
  document.getElementById('mpbCR')?.remove();
  localStorage.removeItem(SK);
  state={promptType:'',step:0,values:{},snapshots:[]};
  render();
}

function saveToProject(pid){
  const title=getVal('suggestedTitle')||suggestTitle(),prompt=getVal('builtPrompt','');
  if(!prompt){alert('Build the prompt first.');return;}
  if(pid==='__new__'){promptNewProject();return;}
  if(pid)setActiveProject(pid);
  logStageToProject(state.promptType,title,prompt);
  renderTracker();
  const b=document.getElementById('saveProjectBtn');
  if(b){const o=b.textContent;b.textContent='Saved to project ✓';setTimeout(()=>b.textContent=o,2000);}
}

function showProjectPicker(){
  const ps=loadProjects();
  document.getElementById('app').innerHTML='<div class="card"><div class="section-title">Switch active project</div>'+(ps.length?ps.map(p=>'<div class="project-card"><div class="project-card-header"><div><div class="project-name">'+eH(p.name)+(p.active?' <span style="font-size:11px;color:var(--green)">(active)</span>':'')+'</div><div class="project-meta">Created '+new Date(p.createdAt).toLocaleDateString()+' · Stages: '+Object.keys(p.stages||{}).join(', ')||'none'+'</div></div><div class="project-btn-row">'+(!p.active?'<button class="btn" onclick="setActiveProject(\x27'+p.id+'\x27);render()">Set active</button>':'')+'<button class="btn" onclick="confirmDeleteProject(\x27'+p.id+'\x27)" style="color:#c0392b;border-color:#c0392b">Delete</button></div></div></div>').join(''):'<p style="color:var(--muted);font-size:14px">No projects yet.</p>')+'<div class="nav" style="margin-top:16px"><button class="btn" onclick="render()">← Back</button></div></div>';
}

function renderTracker(){
  const mount=document.getElementById('trackerMount');if(!mount)return;
  const ps=loadProjects();
  if(!ps.length){mount.innerHTML='<div class="callout blue">No projects yet. Create a project on Step 1 to start tracking your pipeline.</div>';return;}
  mount.innerHTML=ps.map(p=>{
    const st=p.stages||{};
    const pipeline=STAGES.map((s,i)=>{
      const done=!!st[s],last=i===STAGES.length-1;
      const short=done?st[s].title.split(' — ').slice(0,2).join(' — '):'not built';
      const eid='se_'+p.id+'_'+s;
      return '<div class="pipe-stage"><div class="stage-node'+(done?' done':'')+'" onclick="toggleStageExpand(\x27'+eid+'\x27)" style="cursor:'+(done?'pointer':'default')+'" title="'+(done?'Click to preview':'Not built yet')+'"><span class="stage-label">'+s+'</span><span class="stage-val">'+eH(short)+'</span></div>'+(last?'':'<span class="pipe-arrow">→</span>')+'</div>';
    }).join('');
    const details=STAGES.filter(s=>st[s]).map(s=>'<div id="se_'+p.id+'_'+s+'" class="stage-expand"><div style="font-size:12px;font-weight:600;color:var(--dark);margin-bottom:4px">'+s.charAt(0).toUpperCase()+s.slice(1)+' — '+eH(st[s].title)+'</div><div style="font-size:11px;color:var(--muted);margin-bottom:8px">Saved '+new Date(st[s].savedAt).toLocaleString()+'</div><div class="stage-prompt-preview">'+eH((st[s].prompt||'').slice(0,400))+((st[s].prompt||'').length>400?'\n…':'')+'</div><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" style="font-size:12px;padding:5px 10px" onclick="copyText(loadProjects().find(x=>x.id===\x27'+p.id+'\x27).stages[\x27'+s+'\x27].prompt||{})">Copy prompt</button><button class="btn" style="font-size:12px;padding:5px 10px" onclick="loadStageAsContext(\x27'+s+'\x27,\x27'+p.id+'\x27)">Use as context →</button></div></div>').join('');
    return '<div class="project-card"><div class="project-card-header"><div><div class="project-name">'+eH(p.name)+(p.active?' <span style="font-size:11px;color:var(--green)">(active)</span>':'')+'</div><div class="project-meta">Created '+new Date(p.createdAt).toLocaleDateString()+' · '+Object.keys(st).length+'/3 stages complete</div></div><div class="project-btn-row">'+(!p.active?'<button class="btn" style="font-size:12px;padding:5px 10px" onclick="setActiveProject(\x27'+p.id+'\x27);renderTracker()">Set active</button>':'')+(p.active&&state.promptType&&STAGES.includes(state.promptType)?'<button class="btn" style="font-size:12px;padding:5px 10px;border-color:var(--gold-mid);color:var(--gold)" onclick="saveToProject(\x27'+p.id+'\x27)">Save build</button>':'')+'<button class="btn" style="font-size:12px;padding:5px 10px;color:#c0392b;border-color:#c0392b" onclick="confirmDeleteProject(\x27'+p.id+'\x27)">Delete</button></div></div><div class="pipeline">'+pipeline+'</div>'+details+'</div>';
  }).join('');
}

function toggleStageExpand(id){const el=document.getElementById(id);if(el)el.classList.toggle('open');}

function loadStageAsContext(sType,pid){
  const ps=loadProjects(),p=ps.find(x=>x.id===pid);
  if(!p||!p.stages[sType])return;
  const pt=p.stages[sType].prompt||'';
  state={promptType:'',step:0,values:{ctx_raw:pt},snapshots:state.snapshots||[]};
  saveState();window.scrollTo(0,0);render();
  setTimeout(()=>{
    const cb=document.getElementById('ctxBox'),ci=document.getElementById('ctxInput');
    if(cb)cb.classList.remove('hidden');if(ci)ci.value=pt;
  },50);
}

function confirmDeleteProject(id){
  const p=loadProjects().find(x=>x.id===id);if(!p)return;
  showModal('mpbCD','<div style="background:#fff;border-radius:16px;padding:28px;max-width:380px;width:100%;box-shadow:0 8px 40px rgba(0,0,0,.22)"><div style="font-size:15px;font-weight:600;color:var(--dark);margin-bottom:10px">Delete project?</div><div style="font-size:14px;color:var(--muted);margin-bottom:20px">"'+eH(p.name)+'" and all its saved stages will be removed.</div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" onclick="document.getElementById(\x27mpbCD\x27).remove()">Cancel</button><button class="btn" style="background:#c0392b;color:#fff;border-color:#c0392b" onclick="document.getElementById(\x27mpbCD\x27).remove();deleteProject(\x27'+id+'\x27);renderTracker()">Delete</button></div></div>');
}

render();

window.selectType=selectType;window.toggleArray=toggleArray;window.setVal=setVal;window.nextStep=nextStep;window.prevStep=prevStep;window.buildOutput=buildOutput;window.copyText=copyText;window.copyFullSummary=copyFullSummary;window.sendPrompt=sendPrompt;window.saveSnapshotOnly=saveSnapshotOnly;window.showSnapshots=showSnapshots;window.render=render;window.applyCtxAndContinue=applyCtxAndContinue;window.promptNewProject=promptNewProject;window.submitNewProject=submitNewProject;window.confirmRestart=confirmRestart;window.doRestart=doRestart;window.saveToProject=saveToProject;window.showProjectPicker=showProjectPicker;window.setActiveProject=setActiveProject;window.deleteProject=deleteProject;window.renderTracker=renderTracker;window.toggleStageExpand=toggleStageExpand;window.loadStageAsContext=loadStageAsContext;window.confirmDeleteProject=confirmDeleteProject;window.showModal=showModal;window.buildSaveProjectPanel=buildSaveProjectPanel;
</script>
</body>
</html>
